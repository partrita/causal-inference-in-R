[workspace]
authors = ["deepthought <deepthough@postech.ac.kr>"]
channels = ["conda-forge"]
name = "causal-inference-in-R"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
quarto = ">=1.8.27,<2"
r-base = ">=4.3"
r-rmarkdown = "*"
r-knitr = "*"
r-remotes = "*"
r-tidyverse = ">=2.0.0,<3"
r-here = ">=1.0.2,<2"
r-broom = ">=1.0.12,<2"
r-janitor = ">=2.2.1,<3"
r-rcpp = ">=1.1.1,<2"
r-mass = ">=7.3_65,<8"
r-boot = ">=1.3_32,<2"
r-rsample = ">=1.3.2,<2"
r-tidyr = ">=1.3.2,<2"
zlib = ">=1.3.1,<2"

[tasks]
install-r-deps = { cmd = "Rscript -e 'options(repos = c(CRAN = \"https://cran.rstudio.com/\"), timeout = 300); cat(\"Starting package installation...\\n\"); packages_to_install <- c(); tryCatch({ if (!require(remotes, quietly = TRUE)) { cat(\"Installing remotes...\\n\"); install.packages(\"remotes\") }; required_packages <- c(\"MatchIt\", \"cobalt\", \"WeightIt\", \"dagitty\", \"ggokabeito\", \"ggrepel\", \"downlit\", \"xml2\", \"propensity\", \"halfmoon\"); for (pkg in required_packages) { if (!require(pkg, character.only = TRUE, quietly = TRUE)) { cat(\"Installing\", pkg, \"...\\n\"); packages_to_install <- c(packages_to_install, pkg) } }; if (length(packages_to_install) > 0) { cat(\"Installing from CRAN:\", paste(packages_to_install, collapse = \", \"), \"\\n\"); install.packages(packages_to_install, dependencies = TRUE) }; if (!require(ggdag, quietly = TRUE)) { cat(\"Installing ggdag from GitHub...\\n\"); remotes::install_github(\"r-causal/ggdag\", upgrade = \"never\") } else { cat(\"ggdag already available\\n\") }; cat(\"All packages installed successfully\\n\") }, error = function(e) { cat(\"Error:\", e$message, \"\\n\"); quit(status = 1) })'", env = { DOWNLOAD_STATIC_LIBV8 = "1" } }
render = { depends-on = ["install-r-deps"], cmd = "quarto render" }
render-only = "quarto render"
preview = { depends-on = ["install-r-deps"], cmd = "quarto preview" }
clean = "quarto clean"
