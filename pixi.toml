[workspace]
authors = ["deepthought <deepthough@postech.ac.kr>"]
channels = ["conda-forge"]
name = "causal-inference-in-R"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
quarto = ">=1.8.27,<2"
r-base = ">=4.3"
r-rmarkdown = "*"
r-knitr = "*"
r-remotes = "*"
r-tidyverse = ">=2.0.0,<3"
r-here = ">=1.0.2,<2"
r-broom = ">=1.0.12,<2"
r-janitor = ">=2.2.1,<3"
r-rcpp = ">=1.1.1,<2"
r-mass = ">=7.3_65,<8"
r-boot = ">=1.3_32,<2"
r-rsample = ">=1.3.2,<2"
r-tidyr = ">=1.3.2,<2"
zlib = ">=1.3.1,<2"

[tasks]
install-r-deps = { cmd = "Rscript -e 'options(repos = c(CRAN = \"https://cran.rstudio.com/\")); packages_to_install <- c(); tryCatch({ if (!require(remotes, quietly = TRUE)) install.packages(\"remotes\"); if (!require(MatchIt, quietly = TRUE)) packages_to_install <- c(packages_to_install, \"MatchIt\"); if (!require(cobalt, quietly = TRUE)) packages_to_install <- c(packages_to_install, \"cobalt\"); if (!require(WeightIt, quietly = TRUE)) packages_to_install <- c(packages_to_install, \"WeightIt\"); if (!require(dagitty, quietly = TRUE)) packages_to_install <- c(packages_to_install, \"dagitty\"); if (!require(ggokabeito, quietly = TRUE)) packages_to_install <- c(packages_to_install, \"ggokabeito\"); if (!require(ggrepel, quietly = TRUE)) packages_to_install <- c(packages_to_install, \"ggrepel\"); if (!require(downlit, quietly = TRUE)) packages_to_install <- c(packages_to_install, \"downlit\"); if (!require(xml2, quietly = TRUE)) packages_to_install <- c(packages_to_install, \"xml2\"); if (!require(propensity, quietly = TRUE)) packages_to_install <- c(packages_to_install, \"propensity\"); if (!require(halfmoon, quietly = TRUE)) packages_to_install <- c(packages_to_install, \"halfmoon\"); if (length(packages_to_install) > 0) { cat(\"Installing from CRAN:\", paste(packages_to_install, collapse = \", \"), \"\\n\"); install.packages(packages_to_install) }; if (!require(ggdag, quietly = TRUE)) { cat(\"Installing ggdag from GitHub...\\n\"); remotes::install_github(\"r-causal/ggdag\") } else { cat(\"ggdag already available\\n\") } }, error = function(e) { cat(\"Error:\", e$message, \"\\n\") })'", env = { DOWNLOAD_STATIC_LIBV8 = "1" } }
render = { depends-on = ["install-r-deps"], cmd = "quarto render" }
render-only = "quarto render"
preview = { depends-on = ["install-r-deps"], cmd = "quarto preview" }
clean = "quarto clean"
