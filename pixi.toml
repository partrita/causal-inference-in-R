[workspace]
authors = ["deepthought <deepthough@postech.ac.kr>"]
channels = ["conda-forge"]
name = "causal-inference-in-R"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
quarto = ">=1.8.27,<2"
r-base = ">=4.3"
r-rmarkdown = "*"
r-knitr = "*"
r-remotes = "*"
r-tidyverse = ">=2.0.0,<3"
r-here = ">=1.0.2,<2"
r-broom = ">=1.0.12,<2"
r-janitor = ">=2.2.1,<3"
r-rcpp = ">=1.1.1,<2"
r-mass = ">=7.3_65,<8"
r-boot = ">=1.3_32,<2"
r-rsample = ">=1.3.2,<2"
r-tidyr = ">=1.3.2,<2"
r-matchit = "*"
r-cobalt = "*"
r-weightit = "*"
r-dagitty = "*"
r-ggrepel = "*"
r-downlit = "*"
r-xml2 = "*"
r-survey = "*"
r-sandwich = "*"
r-patchwork = "*"
r-gtsummary = "*"
r-labelled = "*"
r-visdat = "*"
r-hms = "*"
r-timedate = "*"
r-glue = "*"
r-gt = "*"
r-mice = "*"
r-skimr = "*"
r-ragg = "*"
r-gert = "*"
r-usethis = "*"
r-cardx = "*"
r-cards = "*"
r-lubridate = "*"
r-smd = "*"
r-kableextra = "*"
"r-broom.helpers" = "*"
r-ggtext = "*"
r-pak = "*"
r-styler = "*"
gsl = "*"
udunits2 = "*"
libgdal = "*"
proj = "*"
cmake = "*"
zlib = ">=1.3.1,<2"

[tasks]
install-r-deps = { cmd = "Rscript -e 'options(repos = c(CRAN = \"https://cran.rstudio.com/\"), timeout = 300); if (!requireNamespace(\"pak\", quietly = TRUE)) install.packages(\"pak\"); deps <- c(\"ggokabeito\", \"PSW\", \"katex\", \"gadenbuie/grkstyle\", \"hadley/emo\", \"datasauRus\", \"quartets\", \"r-causal/ggdag\", \"r-causal/causalworkshop\", \"LucyMcGowan/touringplans\", \"r-causal/tidysmd\", \"r-causal/propensity\", \"r-causal/halfmoon\", \"r-causal/tipr\"); pak::pkg_install(deps)'", env = { DOWNLOAD_STATIC_LIBV8 = "1" } }
style = { cmd = "Rscript -e 'options(styler.addins_style_transformer = \"grkstyle::grk_style_transformer()\"); styler::style_dir(filetype = c(\".R\", \".qmd\"))'" }
render = { depends-on = ["install-r-deps"], cmd = "quarto render" }
render-only = "quarto render"
preview = { depends-on = ["install-r-deps"], cmd = "quarto preview" }
clean = "quarto clean"
