name: Deploy Quarto Book to GitHub Pages

on:
  push:
    branches: [main, master, quarto-book]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Korean fonts (Noto Sans CJK KR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -fv
          echo "Installed fonts:"
          fc-list | grep -i "noto.*cjk\|noto.*kr" || echo "No Noto CJK fonts found via fc-list"

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: .pixi/envs/default/lib/R/library
          key: ${{ runner.os }}-r-lib-${{ hashFiles('pixi.lock') }}
          restore-keys: |
            ${{ runner.os }}-r-lib-

      - name: Install dependencies
        run: pixi install

      - name: Install R package dependencies
        run: |
          echo "Starting R package installation..."
          pixi run install-r-deps
          echo "R package installation completed"
        continue-on-error: false
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          DOWNLOAD_STATIC_LIBV8: 1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Render Quarto Project
        run: pixi run render-only

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4