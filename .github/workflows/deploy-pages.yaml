name: Deploy Quarto Book to GitHub Pages

on:
  push:
    branches: [main, master, quarto-book]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/renv
            ~/.cache/R
          key: ${{ runner.os }}-r-${{ hashFiles('DESCRIPTION', 'renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install dependencies
        run: pixi install

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libgsl-dev \
            libudunits2-dev \
            libgdal-dev \
            libproj-dev \
            cmake \
            build-essential

      - name: Install R package dependencies
        run: |
          echo "Starting R package installation..."
          pixi run install-r-deps
          echo "R package installation completed"
        continue-on-error: false
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          DOWNLOAD_STATIC_LIBV8: 1
          R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Render Quarto Project
        run: pixi run render-only

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4